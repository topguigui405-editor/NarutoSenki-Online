# Compila o APK do Naruto Senki V2 (com o modo online) nos servidores do GitHub.
# Como usar: aba "Actions" -> "Build Android APK" -> "Run workflow".
#  - "Use workflow from": a ramificação onde estão ESTE arquivo e o online-mode-android.patch
#  - source_branch: a ramificação com o código do jogo (normalmente master)
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Ramificação com o código do jogo (normalmente master)"
        required: true
        default: "master"

jobs:
  build:
    name: APK (NDK ${{ matrix.ndk }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ndk: ["21.4.7075529"]
    steps:
      - name: Baixar o código do jogo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Baixar o patch do modo online
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: _ci
          sparse-checkout: |
            online-mode-android.patch
          sparse-checkout-cone-mode: false

      - name: Aplicar o modo online
        run: |
          test -f _ci/online-mode-android.patch || { echo "ERRO: o arquivo online-mode-android.patch nao esta na raiz da ramificacao ${{ github.ref_name }}"; exit 1; }
          cp _ci/online-mode-android.patch .
          rm -rf _ci
          if [ -f projects/NarutoSenki/Classes/Online/OnlineBattle.cpp ]; then
            echo "Modo online ja esta no codigo, nada a aplicar."
          elif ! patch -p1 --forward --no-backup-if-mismatch < online-mode-android.patch; then
            echo ""
            echo "=========== O PATCH NAO ENCAIXOU NESTA VERSAO DO JOGO ==========="
            for rej in $(find . -name '*.rej'); do
              src="${rej%.rej}"
              echo ""
              echo "--- Arquivo: $src ($(wc -l < "$src") linhas)"
              echo "Trechos que falharam (cabecalhos):"
              grep -n '^@@' "$rej" || true
              echo "Primeiras linhas do arquivo:"
              sed -n 1,18p "$src"
            done
            exit 1
          fi

      - name: Instalar SDK e NDK do Android
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-31" "build-tools;31.0.0" "ndk;${{ matrix.ndk }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Compilar
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${{ matrix.ndk }}" >> local.properties
          chmod +x gradlew
          ./gradlew :narutosenki:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Resumo dos erros
        if: failure()
        run: |
          echo "=== Erros de compilacao (arquivo:linha) ==="
          grep -E " error:|undefined reference|Error [0-9]+$" "$RUNNER_TEMP/build.log" | sort -u | head -40 || true
          echo "=== Resumo do Gradle ==="
          grep -A6 "What went wrong" "$RUNNER_TEMP/build.log" | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-Online-NDK-${{ matrix.ndk }}
          path: projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
